# OpenDesk relay behind a local TLS terminator (e.g. cloudflared -> 127.0.0.1:8088).
# Copy .env.example to .env and fill it in. `docker compose up -d` pulls the published image;
# `docker compose up -d --build` builds it from server-relay/ instead.
# The image is pinned to a release (`docker ps` shows which one runs); upgrade by changing RELAY_VERSION.
services:
  relay:
    image: ${RELAY_IMAGE:-ghcr.io/abdullah-fikri/opendesk-relay:${RELAY_VERSION:-1.2.1}}
    build:
      context: ./server-relay
      args:
        VERSION: ${RELAY_VERSION:-1.2.1}
    container_name: opendesk-relay
    restart: unless-stopped
    ports:
      # Loopback only: plaintext WebSocket is reachable just by the local TLS tunnel.
      - "127.0.0.1:8088:8088"
      - "[::1]:8088:8088"
      # UDP relay (OPENDESK_UDP_RELAY_PUBLIC). Loopback by default; set RELAY_UDP_BIND=0.0.0.0 on a server whose
      # public IP clients reach (a tunnel does not carry UDP).
      - "${RELAY_UDP_BIND:-127.0.0.1}:8089:8089/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server-relay/config.json:/app/config.json:ro
    environment:
      TZ: ${TZ:-UTC}
      # Connections reach the container from the Docker bridge, never loopback; TLS ends at the tunnel.
      OPENDESK_TLS_PROXY: "1"
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-opendesk}
      OPENDESK_DEVICE_CREDENTIALS: ${OPENDESK_DEVICE_CREDENTIALS:-}
      OPENDESK_METRICS_TOKEN: ${OPENDESK_METRICS_TOKEN:-}
      OPENDESK_P2P_DISABLED: ${OPENDESK_P2P_DISABLED:-0}
      OPENDESK_UDP_RELAY_PUBLIC: ${OPENDESK_UDP_RELAY_PUBLIC:-}
      OPENDESK_UDP_RELAY_MBPS: ${OPENDESK_UDP_RELAY_MBPS:-50}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
