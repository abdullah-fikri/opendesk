# Release: push a tag "vX.Y.Z" matching VERSION. Publishes the relay image to GHCR and attaches the Windows
# executables and installers, the Linux packages and the Android APK to a GitHub Release. See docs/ci-cd.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opendesk-relay

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Tag matches VERSION and every manifest
        run: scripts/check-version.sh "${{ steps.v.outputs.version }}"

  relay-image:
    name: Relay image (GHCR)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=OpenDesk Relay
            org.opencontainers.image.description=WebSocket relay and session broker for OpenDesk
      - uses: docker/build-push-action@v6
        env:
          # No build-record artifact next to the release files.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: server-relay
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.verify.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    name: Windows client and installers
    needs: verify
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-desktop
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build editions and installers
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force -Path $out, builds\windows | Out-Null
          $editions = @(
            @{ Feature = "";         Exe = "OpenDesk.exe";       Setup = "OpenDesk-Setup.exe" },
            @{ Feature = "admin";    Exe = "OpenDesk-Admin.exe"; Setup = "OpenDesk-Admin-Setup.exe" },
            @{ Feature = "headless"; Exe = "OpenDesk-Host.exe";  Setup = "OpenDesk-Host-Setup.exe" }
          )
          foreach ($e in $editions) {
            $args = @("build", "--manifest-path", "client-desktop/Cargo.toml", "--release", "--locked")
            if ($e.Feature) { $args += @("--features", $e.Feature) }
            cargo @args
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # The installer packages builds\windows\OpenDesk.exe.
            Copy-Item client-desktop\target\release\opendesk-client.exe builds\windows\OpenDesk.exe -Force
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" installer\opendesk.iss
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $stem = [IO.Path]::GetFileNameWithoutExtension($e.Exe)
            $setupStem = [IO.Path]::GetFileNameWithoutExtension($e.Setup)
            Copy-Item builds\windows\OpenDesk.exe "$out\$stem-$env:VERSION.exe"
            Copy-Item builds\windows\OpenDesk-Setup.exe "$out\$setupStem-$env:VERSION.exe"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    name: Linux client and packages
    needs: verify
    # The oldest supported Ubuntu, so the binaries run on every newer distribution too.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libasound2-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-desktop
      - run: cargo install cargo-deb --locked
      - name: Build packages and archive
        run: |
          mkdir -p dist
          make linux-deb linux-tar
          cp builds/linux/*.deb builds/linux/*.tar.gz dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release APK and App Bundle
        working-directory: client-android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Collect
        run: |
          mkdir -p dist
          apk=$(ls client-android/app/build/outputs/apk/release/*.apk | head -1)
          suffix=$([ -n "${ANDROID_KEYSTORE_FILE:-}" ] && echo "" || echo "-unsigned")
          cp "$apk" "dist/OpenDesk-$VERSION$suffix.apk"
          # The App Bundle is what Google Play (internal testing / closed tracks) takes; see client-android/README.md.
          aab=$(ls client-android/app/build/outputs/bundle/release/*.aab | head -1)
          cp "$aab" "dist/OpenDesk-$VERSION$suffix.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  publish:
    name: GitHub Release
    needs: [verify, relay-image, windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The section of this version, without the link definitions at the end of the file.
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {on = 1; next} /^## \[/ {on = 0} /^\[[^]]*\]: / {next} on' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          echo "Relay image: \`$IMAGE:$VERSION\`" >> "$RUNNER_TEMP/notes.md"
      # By name: the run also holds a Docker build record (*.dockerbuild) that is not a release file.
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: dist
      # Auto-update manifests (docs/auto-update.md); skipped until the UPDATE_SIGNING_KEY secret exists.
      - name: Sign update manifests
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
          ROLLOUT: ${{ vars.UPDATE_ROLLOUT_PERCENT || '100' }}
          MIN_VERSION: ${{ vars.UPDATE_MIN_VERSION || '0.0.0' }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::notice::UPDATE_SIGNING_KEY is not set; no auto-update manifests."
            exit 0
          fi
          key="$RUNNER_TEMP/update-key.pem"
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          base="https://github.com/${{ github.repository }}/releases/download/v$VERSION"
          for pair in "manifest.json:OpenDesk-Setup" "manifest-admin.json:OpenDesk-Admin-Setup" "manifest-host.json:OpenDesk-Host-Setup"; do
            name=${pair%%:*} setup="${pair#*:}-$VERSION.exe"
            scripts/sign-manifest.sh "$key" "dist/$setup" "$VERSION" "$base/$setup" "dist/$name" "$ROLLOUT" "$MIN_VERSION"
          done
          rm -f "$key"
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: OpenDesk ${{ needs.verify.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          files: dist/*
