# Release: push a tag "vX.Y.Z" matching VERSION. Publishes the relay image to GHCR and attaches the Windows
# executables, installers and the Android APK to a GitHub Release. See docs/ci-cd.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/opendesk-relay

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Tag matches VERSION and every manifest
        run: scripts/check-version.sh "${{ steps.v.outputs.version }}"

  relay-image:
    name: Relay image (GHCR)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=OpenDesk Relay
            org.opencontainers.image.description=WebSocket relay and session broker for OpenDesk
      - uses: docker/build-push-action@v6
        with:
          context: server-relay
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.verify.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  windows:
    name: Windows client and installers
    needs: verify
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-desktop
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build editions and installers
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force -Path $out, builds\windows | Out-Null
          $editions = @(
            @{ Feature = "";         Exe = "OpenDesk.exe";       Setup = "OpenDesk-Setup.exe" },
            @{ Feature = "admin";    Exe = "OpenDesk-Admin.exe"; Setup = "OpenDesk-Admin-Setup.exe" },
            @{ Feature = "headless"; Exe = "OpenDesk-Host.exe";  Setup = "OpenDesk-Host-Setup.exe" }
          )
          foreach ($e in $editions) {
            $args = @("build", "--manifest-path", "client-desktop/Cargo.toml", "--release", "--locked")
            if ($e.Feature) { $args += @("--features", $e.Feature) }
            cargo @args
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # The installer packages builds\windows\OpenDesk.exe.
            Copy-Item client-desktop\target\release\opendesk-client.exe builds\windows\OpenDesk.exe -Force
            & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" installer\opendesk.iss
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $stem = [IO.Path]::GetFileNameWithoutExtension($e.Exe)
            $setupStem = [IO.Path]::GetFileNameWithoutExtension($e.Setup)
            Copy-Item builds\windows\OpenDesk.exe "$out\$stem-$env:VERSION.exe"
            Copy-Item builds\windows\OpenDesk-Setup.exe "$out\$setupStem-$env:VERSION.exe"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        working-directory: client-android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect
        run: |
          mkdir -p dist
          apk=$(ls client-android/app/build/outputs/apk/release/*.apk | head -1)
          suffix=$([ -n "${ANDROID_KEYSTORE_FILE:-}" ] && echo "" || echo "-unsigned")
          cp "$apk" "dist/OpenDesk-$VERSION$suffix.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  publish:
    name: GitHub Release
    needs: [verify, relay-image, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: OpenDesk ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          body: |
            Relay image: `${{ env.IMAGE }}:${{ needs.verify.outputs.version }}`
          files: dist/*
