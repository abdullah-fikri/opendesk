plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Single source of truth for the version: VERSION at the repository root ("MAJOR.MINOR.PATCH").
def appVersion = rootProject.file('../VERSION').text.trim()
def (major, minor, patch) = appVersion.tokenize('.').collect { it.toInteger() }

// Release signing is optional: CI provides a keystore through these variables (see docs/ci-cd.md at the repository root);
// without them the release APK is built unsigned.
def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.opendesk.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.opendesk.app"
        minSdk 24
        targetSdk 34
        versionCode major * 10000 + minor * 100 + patch
        versionName appVersion
    }

    signingConfigs {
        if (keystoreFile) {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // WebSocket transport to the relay.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // JSON DTOs.
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
}
