plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Single source of truth for the version: VERSION at the repository root ("MAJOR.MINOR.PATCH").
def appVersion = rootProject.file('../VERSION').text.trim()
def (major, minor, patch) = appVersion.tokenize('.').collect { it.toInteger() }

// Release signing (see client-android/README.md#release-signing). Each value comes from an environment variable
// (CI) or the Gradle property of the same name (~/.gradle/gradle.properties locally). The keystore and its
// passwords are never committed. Without a keystore the release APK is built unsigned.
def signingValue = { String name -> System.getenv(name) ?: (project.findProperty(name) as String) }
def keystoreFile = signingValue('ANDROID_KEYSTORE_FILE')

android {
    namespace 'com.opendesk.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.opendesk.app"
        minSdk 24
        targetSdk 36
        versionCode major * 10000 + minor * 100 + patch
        versionName appVersion
    }

    signingConfigs {
        if (keystoreFile) {
            release {
                storeFile file(keystoreFile)
                storePassword signingValue('ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('ANDROID_KEY_ALIAS')
                keyPassword signingValue('ANDROID_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    lint {
        // The viewer must stay installable without warnings: fail the build on any lint error.
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    // WebSocket transport to the relay.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // JSON DTOs.
    implementation 'com.google.code.gson:gson:2.10.1'
    // X25519, ChaCha20-Poly1305 and BLAKE2s for end-to-end encryption (crypto/NoiseXX.kt).
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'

    testImplementation 'junit:junit:4.13.2'
}
