[package]
name = "core-engine"
version = "1.0.0"
edition = "2024"
description = "Screen capture, video codecs, input and clipboard for the OpenDesk Windows client"
license-file = "../LICENSE"
repository = "https://github.com/abdullah-fikri/opendesk"
publish = false

[dependencies]
# DXGI Desktop Duplication / D3D11 (capture) and Media Foundation (H.264): COM vtables by hand would be unreasonable.
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
