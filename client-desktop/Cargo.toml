[package]
name = "opendesk-client"
version = "2.0.0"
edition = "2024"

[features]
default = []
admin = []
headless = []

[dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-default", "renderer-femtovg", "compat-1-2"] }
core-engine = { path = "../core-engine" }
tungstenite = { version = "0.30.0", features = ["native-tls"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
slint-build = "1.18"
