[package]
name = "opendesk-client"
version = "1.0.0"
edition = "2024"
description = "OpenDesk remote desktop client for Windows"
license-file = "../LICENSE"
repository = "https://github.com/abdullah-fikri/opendesk"
publish = false

[features]
default = []
admin = []
headless = []

[dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-default", "renderer-femtovg", "compat-1-2"] }
core-engine = { path = "../core-engine" }
tungstenite = { version = "0.30.0", features = ["native-tls"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snow = "0.10"
getrandom = "0.3"
socket2 = "0.6.5"

[build-dependencies]
slint-build = "1.18"
