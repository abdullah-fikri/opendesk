[package]
name = "opendesk-client"
version = "1.2.1"
edition = "2024"
description = "OpenDesk self-hosted remote desktop client for Windows and Linux"
license-file = "../LICENSE"
repository = "https://github.com/abdullah-fikri/opendesk"
publish = false

[features]
default = []
admin = []
headless = []

[dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-default", "renderer-femtovg", "compat-1-2"] }
core-engine = { path = "../core-engine" }
tungstenite = { version = "0.30.0", features = ["native-tls"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snow = "0.10"
getrandom = "0.3"
# Locks that do not poison: a panic while holding one no longer makes every later `lock()` panic too.
parking_lot = "0.12"
socket2 = "0.6.5"
# Opus voice: libopus 1.3.1 transpiled to Rust (BSD-3-Clause), so no C toolchain and no DLL.
unsafe-libopus = "0.2.0"
# Auto-update: ed25519 signature of the release manifest (curve25519-dalek is already used by snow).
ed25519-dalek = { version = "2", default-features = false }
# Auto-update: HTTPS download of the manifest and the installer over the native-tls already used by tungstenite;
# blocking, no async runtime, follows the GitHub Releases redirect.
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[target.'cfg(not(windows))'.dependencies]
# Software rendering when OpenGL is missing (VMs without a GPU, VNC/xrdp sessions); Windows keeps femtovg only.
slint = { version = "1.18", default-features = false, features = ["renderer-software"] }
# Single instance (flock), user ID and local time.
libc = "0.2"
# Voice through ALSA (PipeWire and PulseAudio provide the ALSA default device).
cpal = "0.18.2"
# Tray icon over D-Bus (StatusNotifierItem); pure Rust, no GTK.
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
# Decodes the tray icon.
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1.18"

# One codegen unit + fat LTO for a smaller, faster binary; no `panic = "abort"`: a panic must only end its thread.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# `cargo deb` (cargo install cargo-deb) builds the Linux package; see `make linux-deb`.
[package.metadata.deb]
name = "opendesk"
maintainer = "OpenDesk <opendesk@users.noreply.github.com>"
copyright = "OpenDesk contributors"
license-file = ["../LICENSE", "0"]
extended-description = """Self-hosted remote desktop: view and control other computers through your own relay server. Hosting needs an X11 session; on Wayland the app works as a viewer only."""
section = "net"
priority = "optional"
# $auto adds the linked libraries (OpenSSL, ALSA, fontconfig); the rest is loaded at runtime by the UI toolkit.
depends = "$auto, libx11-6, libxcursor1, libxrandr2, libxi6, libxkbcommon-x11-0, libgl1"
recommends = "zenity | kdialog, bzip2, curl | wget"
conflicts = "opendesk-admin, opendesk-host"
assets = [
    ["target/release/opendesk-client", "usr/bin/opendesk", "755"],
    ["../packaging/linux/opendesk.desktop", "usr/share/applications/opendesk.desktop", "644"],
    ["../packaging/linux/opendesk-autostart.desktop", "etc/xdg/autostart/opendesk.desktop", "644"],
    ["icon.png", "usr/share/icons/hicolor/256x256/apps/opendesk.png", "644"],
    ["../packaging/linux/install-openh264.sh", "usr/share/opendesk/install-openh264.sh", "755"],
]

[package.metadata.deb.variants.admin]
name = "opendesk-admin"
features = ["admin"]
conflicts = "opendesk, opendesk-host"

[package.metadata.deb.variants.host]
name = "opendesk-host"
features = ["headless"]
conflicts = "opendesk, opendesk-admin"
assets = [
    ["target/release/opendesk-client", "usr/bin/opendesk", "755"],
    ["../packaging/linux/opendesk-autostart.desktop", "etc/xdg/autostart/opendesk.desktop", "644"],
    ["icon.png", "usr/share/icons/hicolor/256x256/apps/opendesk.png", "644"],
    ["../packaging/linux/install-openh264.sh", "usr/share/opendesk/install-openh264.sh", "755"],
]
